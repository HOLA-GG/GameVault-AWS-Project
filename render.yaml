services:
  - type: web
    name: GameVault
    env: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEON_PROJECT_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: none
      - key: PREFERRED_URL_SCHEME
        value: https
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_HTTPONLY
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: WTF_CSRF_ENABLED
        value: "true"
      - key: WTF_CSRF_TIME_LIMIT
        value: "3600"
      - key: WTF_CSRF_SSL_STRICT
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: GAMES_PER_PAGE
        value: "12"
      - key: ADMIN_USERS_PER_PAGE
        value: "25"
      - key: ADMIN_LOGS_PER_PAGE
        value: "50"
      - key: RESET_TOKEN_EXPIRY_MINUTES
        value: "30"
      - key: AUDIT_LOG_RETENTION_DAYS
        value: "90"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: NEON_SSLMODE
        value: require
      - key: DB_USE_NULLPOOL
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "280"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: LOCAL_UPLOAD_DIR
        sync: false
      - key: LOCAL_UPLOAD_URL_PATH
        value: /static/uploads
      - key: SHOW_RESET_DEBUG_TOKEN
        value: "false"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.0"
      - key: MAIL_SERVER
        value: email-smtp.us-east-1.amazonaws.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: GameVault <noreply@gamevault.app>
      - key: MAIL_SUPPRESS_SEND
        value: "false"
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: GameVault
      - key: BOOTSTRAP_ADMIN_LAST_NAME
        value: Admin
