{% extends "base.html" %}

{% block title %}GameVault - Iniciar sesión{% endblock %}

{% block content %}
<div class="nav-bar">
    <div class="nav-links">
        <a href="{{ url_for('main.landing') }}" class="btn btn-secondary">Inicio</a>
        <a href="{{ url_for('main.demo') }}" class="btn btn-secondary">Demo</a>
    </div>
    <div class="nav-links">
        <span style="color:var(--text-secondary);">¿Aún no tienes cuenta?</span>
        <a href="{{ url_for('main.registro') }}" class="btn btn-primary">Registrarme</a>
    </div>
</div>

<section class="section centered">
    <h2>Iniciar sesión</h2>
    <p>Accede a tu panel privado y sigue construyendo tu colección.</p>

    <form action="{{ url_for('main.login') }}" method="POST" id="loginForm">
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="email" id="email" name="email" placeholder="Ej: coleccionista@email.com" required autocomplete="email" maxlength="255" autofocus class="select-on-focus" style="padding-right: 36px;">
                <button type="button" id="loginEmailClearBtn" class="search-clear-btn" aria-label="Borrar correo electrónico" title="Borrar correo electrónico" style="position: absolute; right: 10px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 2px 6px; border-radius: 50%; display: none;">&times;</button>
            </div>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password" maxlength="128" class="select-on-focus">
        </div>
        <button type="submit" class="btn-submit" id="loginSubmitButton" style="width:100%;" data-loading-text="Entrando...">Entrar</button>
    </form>


    <div class="auth-toggle">
        <p>¿Olvidaste tu contraseña?</p>
        <a href="{{ url_for('main.forgot_password') }}">Recuperar acceso</a>
    </div>
</section>

<script nonce="{{ g.csp_nonce }}">
    document.addEventListener('DOMContentLoaded', function () {
        const emailInput = document.getElementById('email');
        const emailClearBtn = document.getElementById('loginEmailClearBtn');

        if (emailInput && emailClearBtn) {
            function updateClearBtnVisibility() {
                emailClearBtn.style.display = emailInput.value.trim().length > 0 ? 'block' : 'none';
            }

            updateClearBtnVisibility();

            emailInput.addEventListener('input', updateClearBtnVisibility);

            emailClearBtn.addEventListener('click', function() {
                emailInput.value = '';
                updateClearBtnVisibility();
                emailInput.dispatchEvent(new Event('input'));
                emailInput.focus();
                window.announceToScreenReader?.('Correo electrónico borrado');
            });
        }
    });
</script>
{% endblock %}
