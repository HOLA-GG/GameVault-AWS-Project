{% extends "base.html" %}

{% block title %}GameVault - Nueva contraseña{% endblock %}

{% block content %}
<section class="section centered">
    <h2>Crear nueva contraseña</h2>
    <p>Cuenta: <strong>{{ email }}</strong></p>

    <form action="{{ url_for('main.reset_password_with_email', token=token) }}" method="POST" id="resetPasswordForm">
        <div class="form-group">
            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Mínimo 8 caracteres (letras y números)" maxlength="128">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirmar contraseña</label>
            <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" maxlength="128">
        </div>
        <button type="submit" class="btn-submit" id="resetPasswordSubmitButton" style="width:100%;" data-loading-text="Actualizando contraseña...">Actualizar contraseña</button>
    </form>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const resetPasswordSubmitButton = document.getElementById('resetPasswordSubmitButton');
        const newPassword = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm_password');

        if (newPassword && confirmPassword) {
            function validatePassword() {
                if (newPassword.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity('Las contraseñas no coinciden');
                } else {
                    confirmPassword.setCustomValidity('');
                }
            }
            newPassword.addEventListener('change', validatePassword);
            confirmPassword.addEventListener('input', validatePassword);
        }

    });
</script>
{% endblock %}
