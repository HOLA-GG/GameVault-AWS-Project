{% extends "base.html" %}

{% block title %}GameVault - Nueva contraseña{% endblock %}

{% block content %}
<section class="section centered">
    <h2>Crear nueva contraseña</h2>
    <p>Cuenta: <strong>{{ email }}</strong></p>

    <form action="{{ url_for('main.reset_password_with_email', token=token) }}" method="POST" id="resetPasswordForm">
        <div class="form-group">
            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Mínimo 8 caracteres (letras y números)" maxlength="128" autofocus class="select-on-focus">
            <div class="strength-meter"><div class="strength-meter-bar"></div></div>
            <small class="strength-text" aria-live="polite"></small>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirmar contraseña</label>
            <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" maxlength="128" placeholder="Repite tu nueva contraseña" class="select-on-focus">
        </div>
        <button type="submit" class="btn-submit" id="resetPasswordSubmitButton" style="width:100%;" data-loading-text="Actualizando contraseña...">Actualizar contraseña</button>
    </form>
</section>

<script nonce="{{ g.csp_nonce }}">
    document.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
            function setupPasswordClearControl(inputId, clearBtnId, clearLabel, clearMessage) {
                const inputEl = document.getElementById(inputId);
                if (!inputEl) return;

                const wrapper = inputEl.closest('.pw-field-wrapper') || inputEl.parentNode;
                if (!wrapper) return;

                inputEl.style.paddingRight = '72px';

                const clearBtn = document.createElement('button');
                clearBtn.type = 'button';
                clearBtn.id = clearBtnId;
                clearBtn.className = 'search-clear-btn';
                clearBtn.setAttribute('aria-label', clearLabel);
                clearBtn.setAttribute('title', clearLabel);
                clearBtn.style.position = 'absolute';
                clearBtn.style.right = '40px';
                clearBtn.style.top = '50%';
                clearBtn.style.transform = 'translateY(-50%)';
                clearBtn.style.background = 'none';
                clearBtn.style.border = 'none';
                clearBtn.style.color = 'var(--text-secondary)';
                clearBtn.style.cursor = 'pointer';
                clearBtn.style.fontSize = '1.2rem';
                clearBtn.style.lineHeight = '1';
                clearBtn.style.padding = '2px 6px';
                clearBtn.style.borderRadius = '50%';
                clearBtn.style.display = 'none';
                clearBtn.style.zIndex = '6';
                clearBtn.innerHTML = '&times;';

                wrapper.appendChild(clearBtn);

                function updateVisibility() {
                    clearBtn.style.display = inputEl.value.length > 0 ? 'block' : 'none';
                }

                updateVisibility();
                inputEl.addEventListener('input', updateVisibility);

                clearBtn.addEventListener('click', function () {
                    inputEl.value = '';
                    updateVisibility();
                    inputEl.dispatchEvent(new Event('input'));
                    inputEl.focus();
                    window.announceToScreenReader?.(clearMessage);
                });
            }

            setupPasswordClearControl('password', 'resetPasswordClearBtn', 'Borrar nueva contraseña', 'Nueva contraseña borrada');
            setupPasswordClearControl('confirm_password', 'resetConfirmPasswordClearBtn', 'Borrar confirmación de contraseña', 'Confirmación de contraseña borrada');
        }, 0);
    });
</script>
{% endblock %}
