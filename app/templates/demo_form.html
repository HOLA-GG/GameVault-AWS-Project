{% extends "base.html" %}

{% block title %}GameVault - Demo{% endblock %}

{% block content %}
<div class="nav-bar">
    <div class="nav-links">
        <a href="{{ url_for('main.landing') }}" class="btn btn-secondary">Inicio</a>
        <a href="{{ url_for('main.demo') }}" class="btn btn-primary">Demo</a>
    </div>
    <div class="nav-links">
        <a href="{{ url_for('main.login') }}" class="btn btn-secondary">Login</a>
        <a href="{{ url_for('main.registro') }}" class="btn btn-secondary">Crear cuenta</a>
    </div>
</div>

<section class="section">
    <h2>Demo pública</h2>
    <p style="color:var(--text-secondary);margin-bottom:20px;">
        Esta demo procesa la imagen en memoria y no toca la base de datos real.
    </p>
    <form action="{{ url_for('main.demo') }}" method="POST" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ej: Super Mario World" required maxlength="255" autofocus class="select-on-focus">
            </div>
            <div class="form-group">
                <label for="imagen">Imagen</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required>
                <div id="demoImagePreviewContainer" class="image-preview-container" style="display:none;">
                    <img id="demoImagePreview" src="" alt="Vista previa de la imagen de la demo" class="image-preview">
                    <button type="button" id="demoRemoveImageButton" class="btn btn-secondary btn-small" aria-label="Quitar imagen seleccionada">Quitar</button>
                </div>
            </div>
        </div>
        <button type="submit" class="btn-submit" id="demoSubmitButton" data-loading-text="Procesando demo...">Procesar demo</button>
    </form>
</section>

<script nonce="{{ g.csp_nonce }}">
    document.addEventListener('DOMContentLoaded', function () {
        const fileInput = document.getElementById('imagen');
        const previewContainer = document.getElementById('demoImagePreviewContainer');
        const previewImage = document.getElementById('demoImagePreview');
        const removeButton = document.getElementById('demoRemoveImageButton');

        if (fileInput && previewContainer && previewImage && removeButton) {
            fileInput.addEventListener('change', function() {
                const file = fileInput.files[0];
                if (file) {
                    if (previewImage.src && previewImage.src.startsWith('blob:')) {
                        URL.revokeObjectURL(previewImage.src);
                    }
                    previewImage.src = URL.createObjectURL(file);
                    previewContainer.style.display = 'flex';
                    window.announceToScreenReader?.(`Imagen seleccionada: ${file.name}`);
                } else {
                    previewContainer.style.display = 'none';
                }
            });

            removeButton.addEventListener('click', function() {
                if (previewImage.src && previewImage.src.startsWith('blob:')) {
                    URL.revokeObjectURL(previewImage.src);
                }
                fileInput.value = '';
                fileInput.focus();
                previewContainer.style.display = 'none';
                previewImage.src = '';
                window.announceToScreenReader?.('Imagen seleccionada quitada');
            });
        }
    });
</script>
{% endblock %}
