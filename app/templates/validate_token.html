{% extends "base.html" %}

{% block title %}GameVault - Validar token{% endblock %}

{% block content %}
<section class="section centered">
    <h2>Validar token</h2>
    <p>Usa esta opción solo si recibiste un token manual y no un enlace directo.</p>

    <form action="{{ url_for('main.verify_token') }}" method="POST" id="validateTokenForm">
        <div class="form-group">
            <label for="token">Token</label>
            <input type="text" id="token" name="token" placeholder="Pega el token aquí" required autocomplete="off">
        </div>
        <button type="submit" class="btn-submit" id="validateTokenSubmitButton" style="width:100%;">Validar token</button>
    </form>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('validateTokenForm');
        const button = document.getElementById('validateTokenSubmitButton');
        if (form && button) {
            form.addEventListener('submit', function() {
                if (form.checkValidity()) {
                    button.disabled = true;
                    button.setAttribute('aria-busy', 'true');
                    button.setAttribute('aria-label', 'Validando token...');
                    button.textContent = 'Validando token...';
                }
            });
        }
    });
</script>
{% endblock %}
